operations:
  view:
    - type: web
      impl: index.html
web: web-src
runtimeManifest:
  packages:
    tccc-gating:
      license: Apache-2.0
      actions:
        get-project:
          function: actions/get-project/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        upload-artifact:
          function: actions/upload-artifact/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        upload-artifact-worker:
          function: actions/upload-artifact-worker/index.js
          runtime: nodejs:18
          limits:
            timeout: 1800000
            memory: 1024
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
        upload-artifact-status:
          function: actions/upload-artifact-status/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        delete-artifact:
          function: actions/delete-artifact/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        extract-fields:
          function: actions/extract-fields/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        # Not a web action — only ever invoked action-to-action (non-blocking)
        # by extract-fields, via the OpenWhisk API. Can run up to 3 hours
        # since it's a non-blocking activation, unlike a blocking web-action
        # HTTP call (hard-capped at 60s regardless of limits.timeout).
        extract-fields-worker:
          function: actions/extract-fields-worker/index.js
          runtime: nodejs:18
          limits:
            timeout: 300000
          inputs:
            LOG_LEVEL: info
        extract-fields-status:
          function: actions/extract-fields-status/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        submit-validated-fields:
          function: actions/submit-validated-fields/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        # Not a web action — only ever invoked action-to-action (non-blocking)
        # by submit-validated-fields, via the OpenWhisk API. Can run up to 3
        # hours since it's a non-blocking activation, unlike a blocking
        # web-action HTTP call (hard-capped at 60s regardless of limits.timeout).
        submit-validated-fields-worker:
          function: actions/submit-validated-fields-worker/index.js
          runtime: nodejs:18
          limits:
            timeout: 300000
          inputs:
            LOG_LEVEL: info
        submit-validated-fields-status:
          function: actions/submit-validated-fields-status/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        chat:
          function: actions/chat/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
          annotations:
            require-adobe-auth: true
            final: true
        get-gate-events:
          function: actions/get-gate-events/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        register-gate-event:
          function: actions/register-gate-event/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        get-documents:
          function: actions/get-documents/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        get-approvers:
          function: actions/get-approvers/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
        assign-approvers:
          function: actions/assign-approvers/index.js
          web: 'yes'
          runtime: nodejs:18
          inputs:
            LOG_LEVEL: info
            WORKFRONT_API_KEY: $WORKFRONT_API_KEY
            WORKFRONT_ALLOWED_HOSTS: $WORKFRONT_ALLOWED_HOSTS
          annotations:
            require-adobe-auth: true
            final: true
hooks:
  pre-app-run: node node_modules/@adobe/uix-guest/scripts/generate-metadata.js
  pre-app-build: node node_modules/@adobe/uix-guest/scripts/generate-metadata.js
  post-app-deploy: ./hooks/post-deploy.js
